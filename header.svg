<svg xmlns="http://www.w3.org/2000/svg" width="860" height="386" viewBox="0 0 860 386" role="img" aria-label="Abigail Ramírez, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 16px; }
    .p { fill: #f1e2e5; } .k { fill: #e9bb74; } .s { fill: #f4c3cd; } .dim { fill: #b98893; }
    .ok { fill: #e9bb74; font-weight: 700; } .m { fill: #ff8fa3; font-weight: 700; }
    .cover { animation: type 1.6s steps(30) 0.6s forwards; }
    .line { opacity: 0; animation: show 0.25s ease-out forwards; }
    .cursor { opacity: 0; animation: show 0s 4.8s forwards, blink 1.1s steps(1) 4.8s infinite; }
    @keyframes type { to { transform: translateX(310px); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cover { animation: none; display: none; } .line, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <!-- ventana -->
  <rect x="1" y="1" width="858" height="384" rx="14" fill="#2b0e17" stroke="#5e2434" stroke-width="2"/>
  <path d="M1 15a14 14 0 0 1 14-14h830a14 14 0 0 1 14 14v27H1z" fill="#3d1521"/>
  <circle cx="26" cy="22" r="6" fill="#ff8fa3"/><circle cx="46" cy="22" r="6" fill="#e9bb74"/><circle cx="66" cy="22" r="6" fill="#f4c3cd"/>
  <text x="430" y="27" text-anchor="middle" class="mono dim" style="font-size:13px">abigail@costa-rica: ~/portfolio</text>

  <!-- petición (efecto de escritura) -->
  <text x="32" y="82" class="mono"><tspan class="dim">$ </tspan><tspan class="m">GET</tspan><tspan class="p"> /api/v1/developers/abigail</tspan></text>
  <rect class="cover" x="68" y="64" width="320" height="26" fill="#2b0e17"/>

  <!-- respuesta -->
  <g class="mono">
    <text x="32" y="114" class="line" style="animation-delay:2.5s" xml:space="preserve"><tspan class="ok">200 OK</tspan><tspan class="dim">  application/json</tspan></text>
    <text x="32" y="150" class="line p" style="animation-delay:2.9s" xml:space="preserve">{</text>
    <text x="32" y="176" class="line" style="animation-delay:3.1s" xml:space="preserve"><tspan class="k">  "name"</tspan><tspan class="p">: </tspan><tspan class="s">"Abigail Ramírez Chavarría"</tspan><tspan class="p">,</tspan></text>
    <text x="32" y="202" class="line" style="animation-delay:3.3s" xml:space="preserve"><tspan class="k">  "role"</tspan><tspan class="p">: </tspan><tspan class="s">"Full Stack Developer"</tspan><tspan class="p">,</tspan></text>
    <text x="32" y="228" class="line" style="animation-delay:3.5s" xml:space="preserve"><tspan class="k">  "focus"</tspan><tspan class="p">: [</tspan><tspan class="s">"Backend"</tspan><tspan class="p">, </tspan><tspan class="s">"REST APIs"</tspan><tspan class="p">, </tspan><tspan class="s">"Database Design"</tspan><tspan class="p">],</tspan></text>
    <text x="32" y="254" class="line" style="animation-delay:3.7s" xml:space="preserve"><tspan class="k">  "architecture"</tspan><tspan class="p">: [</tspan><tspan class="s">"MVC"</tspan><tspan class="p">, </tspan><tspan class="s">"Layered"</tspan><tspan class="p">, </tspan><tspan class="s">"Clean Architecture"</tspan><tspan class="p">, </tspan><tspan class="s">"MVVM"</tspan><tspan class="p">],</tspan></text>
    <text x="32" y="280" class="line" style="animation-delay:3.9s" xml:space="preserve"><tspan class="k">  "stack"</tspan><tspan class="p">: [</tspan><tspan class="s">".NET"</tspan><tspan class="p">, </tspan><tspan class="s">"Laravel"</tspan><tspan class="p">, </tspan><tspan class="s">"SQL"</tspan><tspan class="p">, </tspan><tspan class="s">"Docker"</tspan><tspan class="p">],</tspan></text>
    <text x="32" y="306" class="line" style="animation-delay:4.1s" xml:space="preserve"><tspan class="k">  "location"</tspan><tspan class="p">: </tspan><tspan class="s">"Costa Rica"</tspan><tspan class="p">,</tspan></text>
    <text x="32" y="332" class="line" style="animation-delay:4.3s" xml:space="preserve"><tspan class="k">  "status"</tspan><tspan class="p">: </tspan><tspan class="ok">"open_to_work"</tspan></text>
    <text x="32" y="358" class="line p" style="animation-delay:4.5s" xml:space="preserve">}</text>
  </g>
  <rect class="cursor" x="48" y="344" width="10" height="18" fill="#e9bb74"/>
</svg>
