<svg xmlns="http://www.w3.org/2000/svg" width="860" height="386" viewBox="0 0 860 386" role="img" aria-label="Abigail Ramírez Chavarría, Software Developer (Full Stack)">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 16px; }
    .p { fill: #caceee; } .k { fill: #a288ff; } .s { fill: #60a5fa; } .dim { fill: #949bc8; }
    .ok { fill: #34d399; font-weight: 700; } .m { fill: #22d3ee; font-weight: 700; }
    .line { opacity: 0; animation: show 0.25s ease-out forwards; }
    .cursor { opacity: 0; animation: show 0s 4.8s forwards, blink 1.1s steps(1) 4.8s infinite; }
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.4s ease-in-out 1.3s infinite; }
    .constellation { opacity: 0; animation: show 1.2s ease-out 4.6s forwards; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .cursor, .constellation { animation: none; opacity: 1; } .tw, .tw2 { animation: none; }
    }
  </style>

  <defs>
    <!-- Cielo nocturno del portafolio: nebulosa violeta arriba a la izquierda, azul abajo a la derecha -->
    <radialGradient id="nebulaA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(-40 -30) scale(620 420)">
      <stop offset="0" stop-color="#6d4aff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 420) scale(560 380)">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".26"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a288ff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#a288ff" stop-opacity=".8"/>
      <stop offset=".65" stop-color="#22d3ee" stop-opacity=".7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a288ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="window"><rect x="1" y="1" width="858" height="384" rx="14"/></clipPath>
    <!-- Efecto de escritura de la petición -->
    <clipPath id="typing">
      <rect x="50" y="62" width="0" height="30">
        <animate attributeName="width" begin="0.6s" dur="1.6s" fill="freeze" calcMode="discrete"
          values="0;9.8;19.6;29.4;39.2;49.0;58.8;68.6;78.4;88.2;98.0;107.8;117.6;127.4;137.2;147.0;156.8;166.6;176.4;186.2;196.0;205.8;215.6;225.4;235.2;245.0;254.8;264.6;274.4;284.2;294.0;303.8"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ventana -->
  <g clip-path="url(#window)">
    <rect width="860" height="386" fill="#070a1f"/>
    <rect width="860" height="386" fill="url(#nebulaA)"/>
    <rect width="860" height="386" fill="url(#nebulaB)"/>

    <!-- estrellas -->
    <g fill="#e2e6ff">
      <circle cx="684" cy="78" r="1.3" opacity=".8"/>
      <circle cx="742" cy="64" r="1" opacity=".55"/>
      <circle cx="812" cy="92" r="1.6" class="tw"/>
      <circle cx="776" cy="118" r=".9" opacity=".5"/>
      <circle cx="668" cy="150" r="1" opacity=".6"/>
      <circle cx="836" cy="168" r="1.2" opacity=".75"/>
      <circle cx="660" cy="300" r="1.4" class="tw2"/>
      <circle cx="708" cy="338" r="1" opacity=".55"/>
      <circle cx="846" cy="296" r="1" opacity=".6"/>
      <circle cx="802" cy="352" r="1.5" opacity=".85"/>
      <circle cx="560" cy="120" r=".9" opacity=".45"/>
      <circle cx="610" cy="366" r="1" opacity=".5"/>
      <circle cx="470" cy="360" r=".8" opacity=".4"/>
      <circle cx="520" cy="72" r="1.1" opacity=".5"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="722" cy="102" r="1.4" class="tw2"/>
      <circle cx="836" cy="236" r="1.3" opacity=".8"/>
      <circle cx="752" cy="320" r="1.2" class="tw"/>
    </g>

    <!-- barra de título -->
    <rect width="860" height="42" fill="#0e1332" fill-opacity=".85"/>
    <rect y="41" width="860" height="1.5" fill="url(#beam)"/>
  </g>
  <rect x="1" y="1" width="858" height="384" rx="14" fill="none" stroke="#96a0ff" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="26" cy="22" r="6" fill="#6d4aff"/><circle cx="46" cy="22" r="6" fill="#60a5fa"/><circle cx="66" cy="22" r="6" fill="#22d3ee"/>
  <text x="430" y="27" text-anchor="middle" class="mono dim" style="font-size:13px">abigail@costa-rica: ~/portafolio</text>

  <!-- constelación en forma de A (logo del portafolio) -->
  <g class="constellation" transform="translate(672 140) scale(2.5)">
    <path d="M15 49 32 13 49 49M22.6 33h18.8" fill="none" stroke="url(#trace)" stroke-opacity=".75"
          stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" filter="url(#glow)">
      <circle cx="32" cy="13" r="2.6"/>
      <circle cx="15" cy="49" r="2.1"/>
      <circle cx="49" cy="49" r="2.1"/>
      <circle cx="22.6" cy="33" r="1.6"/>
      <circle cx="41.4" cy="33" r="1.6"/>
    </g>
  </g>

  <!-- petición (efecto de escritura) -->
  <text x="32" y="82" class="mono dim">$ </text>
  <text x="32" y="82" class="mono" clip-path="url(#typing)" xml:space="preserve"><tspan fill="none">  </tspan><tspan class="m">GET</tspan><tspan class="p"> /api/v1/developers/abigail</tspan></text>

  <!-- respuesta -->
  <g class="mono">
    <text x="32" y="114" class="line" style="animation-delay:2.5s" xml:space="preserve"><tspan class="ok">200 OK</tspan><tspan class="dim">  application/json</tspan></text>
    <text x="32" y="150" class="line p" style="animation-delay:2.9s" xml:space="preserve">{</text>
    <text x="32" y="176" class="line" style="animation-delay:3.1s" xml:space="preserve"><tspan class="k">  "name"</tspan><tspan class="p">: </tspan><tspan class="s">"Abigail Ramírez Chavarría"</tspan><tspan class="p">,</tspan></text>
    <text x="32" y="202" class="line" style="animation-delay:3.3s" xml:space="preserve"><tspan class="k">  "role"</tspan><tspan class="p">: </tspan><tspan class="s">"Software Developer (Full Stack)"</tspan><tspan class="p">,</tspan></text>
    <text x="32" y="228" class="line" style="animation-delay:3.5s" xml:space="preserve"><tspan class="k">  "studies"</tspan><tspan class="p">: </tspan><tspan class="s">"Information Systems Eng. · UNA"</tspan><tspan class="p">,</tspan></text>
    <text x="32" y="254" class="line" style="animation-delay:3.7s" xml:space="preserve"><tspan class="k">  "stack"</tspan><tspan class="p">: [</tspan><tspan class="s">".NET"</tspan><tspan class="p">, </tspan><tspan class="s">"Laravel"</tspan><tspan class="p">, </tspan><tspan class="s">"Spring Boot"</tspan><tspan class="p">, </tspan><tspan class="s">"Kotlin"</tspan><tspan class="p">],</tspan></text>
    <text x="32" y="280" class="line" style="animation-delay:3.9s" xml:space="preserve"><tspan class="k">  "practices"</tspan><tspan class="p">: [</tspan><tspan class="s">"Clean Architecture"</tspan><tspan class="p">, </tspan><tspan class="s">"MVVM"</tspan><tspan class="p">, </tspan><tspan class="s">"SOLID"</tspan><tspan class="p">],</tspan></text>
    <text x="32" y="306" class="line" style="animation-delay:4.1s" xml:space="preserve"><tspan class="k">  "location"</tspan><tspan class="p">: </tspan><tspan class="s">"Heredia, Costa Rica"</tspan><tspan class="p">,</tspan></text>
    <text x="32" y="332" class="line" style="animation-delay:4.3s" xml:space="preserve"><tspan class="k">  "status"</tspan><tspan class="p">: </tspan><tspan class="ok">"open_to_internship"</tspan></text>
    <text x="32" y="358" class="line p" style="animation-delay:4.5s" xml:space="preserve">}</text>
  </g>
  <rect class="cursor" x="48" y="344" width="10" height="18" fill="#22d3ee"/>
</svg>
